# .github/workflows/setup-slipgate.yml
name: 🚀 Setup SlipGate VayDNS (Robust)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'دامنه برای تونل VayDNS'
        required: true
        type: string
        default: 'v.slgo.ir'
      tag:
        description: 'نام تونل'
        required: false
        type: string
        default: 'vaydns'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🌐 بررسی در دسترس بودن سرور
        run: |
          echo "🧪 تست ارتباط با 31.15.18.179 روی پورت 22..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq netcat-openbsd
          if nc -zv -w5 31.15.18.179 22; then
            echo "✅ سرور در دسترس است"
          else
            echo "❌ سرور پاسخ نمی‌دهد! لطفاً وضعیت VPS را بررسی کنید"
            exit 1
          fi

      - name: 🚀 نصب و راه‌اندازی از طریق SSH
        env:
          SERVER_HOST: 31.15.18.179
          SERVER_USER: root
          SERVER_PASSWORD: HlpZsJkvYozk
          DOMAIN: ${{ github.event.inputs.domain }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "🔌 اتصال به ${SERVER_HOST}..."
          sudo apt-get install -y -qq sshpass

          # تلاش برای اتصال و اجرای دستورات
          sshpass -p "${SERVER_PASSWORD}" ssh \
            -v \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            ${SERVER_USER}@${SERVER_HOST} '
          set -e
          echo "connection ok"
          '

          echo "✅ اتصال SSH موفق بود"

      - name: 📦 اجرای کامل اسکریپت نصب
        env:
          SERVER_HOST: 31.15.18.179
          SERVER_USER: root
          SERVER_PASSWORD: HlpZsJkvYozk
          DOMAIN: ${{ github.event.inputs.domain }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          sshpass -p "${SERVER_PASSWORD}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${SERVER_USER}@${SERVER_HOST} bash << 'ENDSSH'
          set -e
          
          echo "==================================="
          echo "🚀 شروع نصب اسلیپ‌گیت"
          echo "==================================="
          
          # ۱. بروزرسانی
          echo "[1/6] بروزرسانی..."
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq curl wget ufw jq dnsutils
          
          # ۲. نصب اسلیپ‌گیت
          echo "[2/6] نصب اسلیپ‌گیت..."
          curl -fsSL https://raw.githubusercontent.com/anonvector/slipgate/main/install.sh | bash
          which slipgate
          
          # ۳. فایروال
          echo "[3/6] تنظیم فایروال..."
          ufw allow 22/tcp || true
          ufw allow 53/udp || true
          ufw allow 443/tcp || true
          ufw allow 1080/tcp || true
          ufw --force enable || true
          
          # ۴. ساخت تونل
          echo "[4/6] ساخت تونل VayDNS..."
          slipgate tunnel add \
            --transport vaydns \
            --backend socks \
            --tag ${TAG} \
            --domain ${DOMAIN}
          
          # ۵. تنظیمات پیشرفته
          echo "[5/6] تنظیمات پیشرفته..."
          slipgate tunnel edit --tag ${TAG} \
            --mtu 1232 \
            --record-type txt \
            --idle-timeout 10s \
            --keep-alive 2s
          
          # ۶. استارت و نمایش لینک
          echo "[6/6] استارت تونل..."
          slipgate tunnel start ${TAG}
          sleep 3
          
          echo ""
          echo "==================================="
          slipgate tunnel status
          echo ""
          echo "🔗 لینک اشتراک SlipNet:"
          slipgate tunnel share ${TAG}
          echo "==================================="
          ENDSSH
